resources:
  jobs:
    V_Credit_Pipeline:
      name: V-Credit Pipeline
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: 01_Setup
            source: GIT
        - task_key: to_bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: 02_Bronze_Layer
            source: GIT
        - task_key: to_silver
          depends_on:
            - task_key: to_bronze
          notebook_task:
            notebook_path: 03_Silver_Layer
            source: GIT
        - task_key: to_gold
          depends_on:
            - task_key: to_silver
          notebook_task:
            notebook_path: 04_Gold_Layer
            source: GIT
        - task_key: export_gold
          depends_on:
            - task_key: to_gold
          notebook_task:
            notebook_path: 05_Exportacao_Gold
            source: GIT
      git_source:
        git_url: https://github.com/pietroggu/rocket-lab-v-credit
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED